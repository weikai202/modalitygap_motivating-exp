name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu-and-real-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu.lock -r requirements-data.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/fetch_model.py --processor-only
      - run: python -m unittest discover -s tests -v
        env:
          MODALITYGAP_PROCESSOR: artifacts/hf-cache/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3
          OMP_NUM_THREADS: '1'
          HF_HUB_OFFLINE: '1'
