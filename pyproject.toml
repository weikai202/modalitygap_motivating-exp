[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modalitygap"
version = "0.4.0"
requires-python = ">=3.12"
description = "Reproducible Qwen2.5-VL full-dataset modality reliance experiments"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1", "peft==0.17.1", "accelerate==1.10.1", "Pillow==11.3.0", "numpy==2.2.6", "matplotlib==3.10.6"]

[project.scripts]
modalitygap = "modalitygap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
